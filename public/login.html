
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberMonitor | Acceso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main style="max-width: 450px; margin: 80px auto; padding: 30px;">
        <section class="panel">
            <div class="panel-header">
                <div>
                    <p class="section-label">CYBERMONITOR</p>
                    <h1 id="tituloAcceso">Iniciar sesión</h1>
                    <p id="descripcionAcceso">
                        Ingresa con tu cuenta para continuar.
                    </p>
                </div>
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        maxlength="30"
                        autocomplete="username"
                    >
                </div>

                <br>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <br>

                <button type="submit" class="btn-primary" style="width: 100%;">
                    Iniciar sesión
                </button>
            </form>

            <form id="formRegistro" hidden>
                <div class="form-group">
                    <label for="nombreRegistro">Nombre completo</label>
                    <input
                        type="text"
                        id="nombreRegistro"
                        name="nombre"
                        required
                        maxlength="100"
                        autocomplete="name"
                    >
                </div>

                <br>

                <div class="form-group">
                    <label for="usernameRegistro">Nombre de usuario</label>
                    <input
                        type="text"
                        id="usernameRegistro"
                        name="username"
                        required
                        minlength="3"
                        maxlength="30"
                        pattern="[a-zA-Z0-9_.-]+"
                        autocomplete="username"
                    >
                    <small>Usa entre 3 y 30 letras, números, puntos, guiones o guiones bajos.</small>
                </div>

                <br>

                <div class="form-group">
                    <label for="passwordRegistro">Contraseña</label>
                    <input
                        type="password"
                        id="passwordRegistro"
                        name="password"
                        required
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                    >
                    <small>Debe tener entre 8 y 72 caracteres.</small>
                </div>

                <br>

                <button type="submit" class="btn-primary" style="width: 100%;">
                    Crear cuenta
                </button>
            </form>

            <div
                id="mensajeLogin"
                class="mensaje-formulario"
                role="status"
                aria-live="polite"
            ></div>

            <p style="text-align: center; margin-top: 20px;">
                <span id="textoAlternar">¿No tienes una cuenta?</span>
                <button
                    type="button"
                    id="btnAlternar"
                    class="btn-primary"
                    style="margin-left: 5px;"
                >
                    Crear cuenta
                </button>
            </p>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
