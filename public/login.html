<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberMonitor | Iniciar sesión</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main style="
        max-width: 450px;
        margin: 80px auto;
        padding: 30px;
    ">

        <section class="panel">

            <div class="panel-header">

                <div>

                    <p class="section-label">
                        CYBERMONITOR
                    </p>

                    <h1>
                        Iniciar sesión
                    </h1>

                </div>

            </div>

            <form id="formLogin">

                <div class="form-group">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                    >

                </div>

                <br>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >

                </div>

                <br>

                <button
                    type="submit"
                    class="btn-primary"
                    style="width: 100%;"
                >
                    Iniciar sesión
                </button>

            </form>

            <div
                id="mensajeLogin"
                class="mensaje-formulario"
                aria-live="polite"
            ></div>

        </section>

    </main>

    <script src="login.js"></script>

</body>

</html>
